name: Public Hash List

on:
  schedule:
    # Every Monday at 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: public-hash-list
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate PHL data
    runs-on: ubuntu-latest
    # The nuxt-cos source runs an npm install and a Vite build per matrix cell:
    # about five minutes at one covered release, and proportionally more if
    # several accumulate (see NUXT_COS_MAX_RECIPES).
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: public-hash-list/implementation
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Must run before the pipeline: the pipeline rewrites the release record
      # it compares against. A new plugin release changes every chunk hash that
      # source emits, so this is what turns a silent regeneration into a report.
      - name: Check for new nuxt-cos plugin releases
        id: nuxt-cos
        run: node nuxt-cos.js --check-recipes

      - name: Run the PHL pipeline
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
          # Optional. The model-hub source makes one Hub request per model, and
          # the Hub rate-limits anonymous traffic per IP — shared runner IPs all
          # the more so. Without this the source still completes, but warns that
          # it dropped models to 429s.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm start

      - name: Commit and push regenerated data
        run: |
          git add data/ nuxt-cos-releases.json hash-cache/ overlap.json
          if git diff --cached --quiet; then
            echo "No changes to the Public Hash List, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Public Hash List [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto origin/main and retrying..."
            git pull --rebase origin main
          done
          echo "::error::Giving up after 5 push attempts."
          exit 1

      # The commit is the notification; this just makes the run page say what
      # changed, since data/ is stored with Git LFS and does not diff readably.
      - name: Summarise new nuxt-cos hashes
        if: steps.nuxt-cos.outputs.changed == 'true'
        env:
          ADDED: ${{ steps.nuxt-cos.outputs.added }}
        run: |
          {
            echo "### nuxt-cos: new \`vite-plugin-cross-origin-storage\` release(s): \`$ADDED\`"
            echo
            echo "\`data/nuxt-cos-hashes.csv\` has been rebuilt. Releases that emit"
            echo "byte-identical chunks share one recipe, so a release that changed no"
            echo "bytes adds no hashes. Recipes covered after this run:"
            echo
            echo '```'
            node -e "for (const r of JSON.parse(require('fs').readFileSync('nuxt-cos-releases.json','utf8')).recipes) console.log(\`recipe \${r.recipe ?? '—'}  vite-plugin-cross-origin-storage@\${(r.plugins ?? [r.plugin]).join(', ')}  rolldown \${r.rolldown}  \${r.chunkCount} chunks  (nuxt-cos@\${r.nuxtCos.join(', ') || '—'})\`)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
